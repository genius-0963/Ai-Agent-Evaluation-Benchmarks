name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install package and dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip check
      - name: Lint with ruff
        run: ruff check .
      - name: Format check with ruff
        run: ruff format --check .
      - name: Validate benchmark schemas
        run: python scripts/validate_benchmarks.py
      - name: Run unit test suite
        run: pytest tests/unit -v
      - name: Execute statistical evaluation
        run: agentbench eval config-recovery-001 --trials 2
      - name: Generate leaderboards
        run: agentbench leaderboard
      - name: Upload Leaderboard Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-leaderboards
          path: |
            results/leaderboard.html
            results/LEADERBOARD.md
            results/experiments_index.json
