name: Docker Integration

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  docker-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install package and dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Build benchmark Docker images
        run: |
          agentbench build config-recovery-001
          agentbench build contract-repair-001
          agentbench build multi-service-cache-001
      - name: Run container smoke test
        run: |
          agentbench smoke-test config-recovery-001
          agentbench smoke-test contract-repair-001
          agentbench smoke-test multi-service-cache-001
      - name: Run Docker integration test suite
        run: pytest tests/integration -v
      - name: Execute end-to-end benchmark run with Docker
        run: |
          agentbench run config-recovery-001 --agent scripted --docker
          agentbench run contract-repair-001 --agent scripted --docker
          agentbench run multi-service-cache-001 --agent scripted --docker
