# Default framework configuration for agentbench
version: "1.0"

benchmarks_directory: "benchmarks"
results_directory: "results"

docker:
  default_base_image: "python:3.12-slim"
  auto_cleanup: true
  stop_timeout_seconds: 5
  enforce_network_isolation: true

runner:
  default_agent: "scripted"
  default_timeout_seconds: 180
  capture_logs: true
  save_artifacts: true

reporting:
  schema_version: "1.0"
  output_format: "json"
